[project]
name = "robo-semantic-runtime"
version = "0.1.0"
description = "Local Qwen3-VL adapter for bounded temporal annotation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers==5.5.4",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy==2.2.6",
    "pydantic==2.14.1",
    "pytest==9.2.0",
    "pillow==13.0.0",
    "opencv-python-headless==4.13.0.92",
]

[tool.uv]
package = false
required-version = "==0.12.23"
cache-dir = ".cache/uv"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
