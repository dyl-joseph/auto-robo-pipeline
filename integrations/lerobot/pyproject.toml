[project]
name = "robo-lerobot-runtime"
version = "0.1.0"
description = "Isolated official LeRobot dataset writer and loader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lerobot[dataset]==0.6.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchcodec==0.11.0",
    "pydantic==2.14.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false
required-version = "==0.12.23"
cache-dir = ".cache/uv"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchcodec = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
