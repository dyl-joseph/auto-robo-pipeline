name: Verify episode workflow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mlx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked --project integrations/mlx_pi
      - run: uv run --locked --project integrations/mlx_pi python -m pytest -q integrations/mlx_pi
      - run: uv run --locked --project integrations/mlx_pi python -m integrations.mlx_pi.verify
      - uses: actions/upload-artifact@v4
        with:
          name: mlx-pi05-evidence
          path: artifacts/mlx-pi05.json
          retention-days: 14
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./scripts/setup.sh
      - run: uv run --locked python scripts/check_environment.py
      - run: uv run --locked python -m scripts.fetch_model
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check . && uv run --locked ruff format --check .
      - run: npm ci --cache .cache/npm
      - run: npm run check:web && npm run format:check
      - run: npx playwright install --with-deps chrome ffmpeg
      - run: npm run test:e2e
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: uv run --locked python -m scripts.labelstudio_smoke --sync-contract
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: uv run --locked python -m scripts.labelstudio_smoke --browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          LS_TASK_LOADING_CONTRACT: "1"
          LS_CPU_RATE: "6"
          ROBO_NATIVE_EXPORT_FIXTURE: artifacts/native-training-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: native-training-fixture
          path: artifacts/native-training-fixture
          retention-days: 14
      - run: uv run --locked python -m scripts.labelstudio_smoke --batch
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            artifacts/browser-tests
            artifacts/labelstudio-*.json
            artifacts/labelstudio-failure*
            artifacts/labelstudio-sync-*.png
            artifacts/batch-workflow.json
            artifacts/batch-*.png
            docs/evidence
          retention-days: 14
  lerobot:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --project integrations/lerobot
      - run: uv run --locked --project integrations/lerobot python -m pytest -q integrations/lerobot/test_roundtrip.py
      - uses: actions/download-artifact@v4
        with:
          name: native-training-fixture
          path: artifacts/native-training-fixture
      - run: uv run --locked --project integrations/lerobot python -m integrations.lerobot.verify_native artifacts/native-training-fixture artifacts/native-lerobot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lerobot-evidence
          path: |
            artifacts/lerobot-native.json
            artifacts/native-lerobot
          retention-days: 14
  droid:
    needs: lerobot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ./scripts/setup.sh
      - run: uv run --locked python -m scripts.fetch_droid
      - run: uv sync --locked --project integrations/droid
      - run: uv run --locked --project integrations/droid python -m integrations.droid.convert data/local/droid-sample data/local/droid-converted
      - run: npm ci --cache .cache/npm
      - run: npx playwright install --with-deps chrome ffmpeg
      - run: uv run --locked python -m scripts.labelstudio_smoke --browser --source data/local/droid-converted/source.json
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          ROBO_NATIVE_EXPORT_FIXTURE: artifacts/droid-native-fixture
      - run: uv sync --locked --project integrations/lerobot
      - run: uv run --locked --project integrations/lerobot python -m integrations.lerobot.verify_droid data/local/droid-converted artifacts/droid-native-fixture artifacts/droid-lerobot
      - run: uv run --locked python -m scripts.labelstudio_smoke --batch --source data/local/droid-converted/source.json
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      # Verification metadata only. No dataset bytes, video, database or session upload.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: droid-verification-metadata
          path: |
            artifacts/droid-lerobot.json
            artifacts/droid-browser.json
            artifacts/batch-workflow.json
            data/local/droid-converted/conversion.json
          retention-days: 14
